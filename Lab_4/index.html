<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app" class="app-container">
      <header>
        <h1>Task Manager</h1>
        <div class="history-actions" style="display: flex; gap: 1rem; margin-left: auto;">
          <button id="undo-btn" class="btn" title="Undo" type="button">Undo</button>
          <button id="redo-btn" class="btn" title="Redo" type="button">Redo</button>
        </div>
      </header>

      <main>
        <div class="card">
          <h2>Add New Task</h2>
          <form id="add-task-form">
            <div class="form-group">
              <label for="title">Title</label>
              <input type="text" id="title" placeholder="Task title" required />
            </div>
            <div class="form-group">
              <label for="description">Description</label>
              <textarea id="description" placeholder="Task description"></textarea>
            </div>
            <div class="form-group">
              <label for="priority">Priority</label>
              <select id="priority">
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
              </select>
            </div>
            <div class="form-group">
              <label for="status">Status</label>
              <select id="status">
                <option value="To Do">To Do</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">+ Add Task</button>
              <button type="button" id="reset-all" class="btn btn-danger">Reset All</button>
            </div>
          </form>
        </div>

        <div class="card">
          <div class="filters">
            <button class="btn filter-btn active" data-filter="All">All</button>
            <button class="btn filter-btn" data-filter="To Do">To Do</button>
            <button class="btn filter-btn" data-filter="In Progress">In Progress</button>
            <button class="btn filter-btn" data-filter="Completed">Completed</button>
          </div>
          <div id="task-list" class="task-list">
            <!-- Tasks will be rendered here -->
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
